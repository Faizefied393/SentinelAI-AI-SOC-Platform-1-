services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SENTINEL_DB: /project/data/sentinelai.db
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sentinel_data:/project/data
  dashboard:
    build: .
    command: ["streamlit", "run", "app/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      SENTINEL_API: http://api:8000
    depends_on:
      - api
volumes:
  sentinel_data:
